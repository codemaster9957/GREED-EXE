services:
  - type: web
    name: greed-exe
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
    # Uncomment and set when you add PostgreSQL persistence:
    # - key: DATABASE_URL
    #   fromDatabase:
    #     name: greed-exe-db
    #     property: connectionString

# Keep the repository root available because the server imports ../shared.
# Do not set rootDir: server unless shared/ is moved inside server/.

# Uncomment when you add a PostgreSQL database:
# databases:
#   - name: greed-exe-db
#     plan: free
