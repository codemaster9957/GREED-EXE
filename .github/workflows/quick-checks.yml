name: Quick checks

on:
  push:
    branches:
      - main
      - fix/quick-main-issues
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run server regression tests
        run: node --test server/tests/*.test.js

      - name: Smoke-test server health endpoint
        shell: bash
        run: |
          npm start --prefix server > server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 0.5
          done

          cat server-smoke.log
          exit 1

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build production client
        run: npm run build --prefix client
