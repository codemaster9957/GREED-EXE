<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GREED.exe — multiplayer arena chaos. Collect. Bank. Fight. Get greedy." />
  <title>GREED.exe</title>
  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #00ff88;
      --gold:    #ffd700;
      --red:     #ff2244;
      --cyan:    #00eeff;
      --purple:  #cc44ff;
      --dark:    #050810;
      --dark2:   #0a1020;
      --panel:   rgba(0,20,40,0.85);
      --border:  rgba(0,255,136,0.25);
      --font:    'Courier New', 'Lucida Console', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      color: var(--green);
      font-family: var(--font);
      overflow: hidden;
      user-select: none;
    }

    /* ── Three.js canvas ───────────────────────────── */
    #game-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* ── Overlay layer (HUD, menus, etc.) ──────────── */
    #ui-root {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* ── Connection screen ──────────────────────────── */
    #connect-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      z-index: 100;
    }

    .logo {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--green);
      text-shadow: 0 0 30px var(--green), 0 0 60px rgba(0,255,136,0.4);
      animation: logo-pulse 2s ease-in-out infinite alternate;
    }
    .logo span { color: var(--gold); text-shadow: 0 0 30px var(--gold); }

    @keyframes logo-pulse {
      from { text-shadow: 0 0 20px var(--green), 0 0 40px rgba(0,255,136,0.3); }
      to   { text-shadow: 0 0 50px var(--green), 0 0 100px rgba(0,255,136,0.6); }
    }

    .connect-status {
      margin-top: 2rem;
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: rgba(0,255,136,0.7);
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .connect-dots { display: inline-block; width: 2em; text-align: left; }

    .connect-hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: rgba(0,255,136,0.35);
      letter-spacing: 0.1em;
    }

    #connect-retry-btn {
      display: none;
      margin-top: 2rem;
      padding: 0.75rem 2.5rem;
      background: transparent;
      border: 2px solid var(--green);
      color: var(--green);
      font-family: var(--font);
      font-size: 1rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      pointer-events: all;
      transition: all 0.2s;
    }
    #connect-retry-btn:hover {
      background: var(--green);
      color: var(--dark);
    }

    /* ── Name entry ──────────────────────────────────── */
    #name-screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      z-index: 99;
    }

    #name-screen h2 {
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    #name-input {
      background: var(--dark2);
      border: 2px solid var(--green);
      color: var(--green);
      font-family: var(--font);
      font-size: 1.4rem;
      padding: 0.6rem 1.2rem;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
      pointer-events: all;
      max-width: 280px;
      width: 100%;
      text-transform: uppercase;
    }
    #name-input::placeholder { color: rgba(0,255,136,0.3); }
    #name-input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,215,0,0.3); }

    #name-submit-btn {
      margin-top: 1.2rem;
      padding: 0.75rem 3rem;
      background: var(--green);
      border: none;
      color: var(--dark);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      cursor: pointer;
      pointer-events: all;
      transition: all 0.15s;
    }
    #name-submit-btn:hover { background: var(--gold); }

    /* ── Scanlines overlay ───────────────────────────── */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
    }

    /* ── Meltdown flash overlay ──────────────────────── */
    #meltdown-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255,50,0,0.15) 0%, transparent 70%);
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <!-- Three.js render target -->
  <canvas id="game-canvas"></canvas>

  <!-- All in-game UI layers -->
  <div id="ui-root"></div>

  <!-- Persistent overlays -->
  <div class="scanlines"></div>
  <div id="meltdown-flash"></div>

  <!-- Connection screen (shown on load) -->
  <div id="connect-screen">
    <div class="logo">GREED<span>.exe</span></div>
    <div class="connect-status">
      CONNECTING<span class="connect-dots" id="connect-dots">...</span>
    </div>
    <div class="connect-hint" id="connect-hint">INITIALIZING SERVER CONNECTION</div>
    <button id="connect-retry-btn">RETRY</button>
  </div>

  <!-- Name entry (shown after first connect) -->
  <div id="name-screen">
    <h2>ENTER YOUR NAME</h2>
    <input
      id="name-input"
      type="text"
      maxlength="16"
      placeholder="PLAYER"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="name-submit-btn">ENTER ARENA</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
